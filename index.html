<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacation Control Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const STORAGE_KEY = "vacation-calendar-planner-v5";
      const LEGACY_STORAGE_KEYS = [
        "vacation-calendar-planner-v4",
        "vacation-calendar-planner-v3",
        "vacation-calendar-planner-v2",
        "vacation-calendar-planner-v1",
      ];
      const BACKUP_FILE_PREFIX = "vacation-planner";

      const DAY_TYPES = {
        VACATION_FULL: "Vacation Full Day",
        VACATION_HALF: "Vacation Half Day",
        FLEX_TIME: "Flex Time",
        BIRTHDAY: "Birthday Day",
        BONUS: "Bonus Day",
        HOLIDAY: "National / Local Holiday",
      };

      const STATUSES = {
        PLANNED: "Planned",
        CONFIRMED: "Confirmed",
      };

      const MONTH_NAMES = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December",
      ];

      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      function formatDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function getDaysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
      }

      function getMondayBasedStartOffset(year, monthIndex) {
        const jsDay = new Date(year, monthIndex, 1).getDay();
        return jsDay === 0 ? 6 : jsDay - 1;
      }

      function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
      }

      function toSafeNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      }

      function clampNumber(value, min, max) {
        const safeValue = toSafeNumber(value);
        return Math.min(Math.max(safeValue, min), max);
      }

      function isPlainObject(value) {
        return typeof value === "object" && value !== null && !Array.isArray(value);
      }

      function isValidDateKey(dateKey) {
        if (typeof dateKey !== "string") return false;
        if (dateKey.length !== 10) return false;
        if (dateKey[4] !== "-" || dateKey[7] !== "-") return false;

        const year = Number(dateKey.slice(0, 4));
        const month = Number(dateKey.slice(5, 7));
        const day = Number(dateKey.slice(8, 10));

        if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day)) return false;
        if (month < 1 || month > 12) return false;
        if (day < 1 || day > getDaysInMonth(year, month - 1)) return false;

        return true;
      }

      function getDefaultYearSettings() {
        return {
          baseDays: 22,
          birthdayDays: 1,
          bonusDays: 1,
          carryOverDays: 4,
          flexTimeDays: 0,
        };
      }

      function normalizeYearSettings(input) {
        const defaults = getDefaultYearSettings();
        if (!isPlainObject(input)) return defaults;

        return {
          baseDays: Math.max(0, toSafeNumber(input.baseDays)),
          birthdayDays: clampNumber(input.birthdayDays, 0, 1),
          bonusDays: Math.max(0, toSafeNumber(input.bonusDays)),
          carryOverDays: Math.max(0, toSafeNumber(input.carryOverDays)),
          flexTimeDays: Math.max(0, toSafeNumber(input.flexTimeDays)),
        };
      }

      function getDefaultPlannerState() {
        const currentYear = new Date().getFullYear();
        return {
          year: currentYear,
          yearSettings: {
            [currentYear]: getDefaultYearSettings(),
          },
          excludeWeekends: true,
          selectedDates: {},
          selectedDayType: DAY_TYPES.VACATION_FULL,
          selectedStatus: STATUSES.PLANNED,
          lastSavedAt: null,
        };
      }

      function getDayAmount(dayType) {
        if (dayType === DAY_TYPES.VACATION_HALF) return 0.5;
        if (dayType === DAY_TYPES.HOLIDAY) return 0;
        return 1;
      }

      function isCountedDay(dayEntry) {
        return dayEntry?.type !== DAY_TYPES.HOLIDAY;
      }

      function normalizeSelectedDates(selectedDates) {
        if (!isPlainObject(selectedDates)) return {};

        return Object.keys(selectedDates).reduce((acc, dateKey) => {
          if (!isValidDateKey(dateKey)) return acc;

          const input = selectedDates[dateKey] || {};
          const rawType = input.type || DAY_TYPES.VACATION_FULL;
          const migratedType = rawType === "Vacation" ? DAY_TYPES.VACATION_FULL : rawType;
          const validType = Object.values(DAY_TYPES).includes(migratedType)
            ? migratedType
            : DAY_TYPES.VACATION_FULL;

          const rawStatus = input.status || STATUSES.PLANNED;
          const validStatus = Object.values(STATUSES).includes(rawStatus)
            ? rawStatus
            : STATUSES.PLANNED;

          acc[dateKey] = {
            type: validType,
            amount: getDayAmount(validType),
            status: validType === DAY_TYPES.HOLIDAY ? STATUSES.CONFIRMED : validStatus,
          };

          return acc;
        }, {});
      }

      function normalizeAllYearSettings(input, fallbackYear, legacyInput) {
        const normalizedYearSettings = {};

        if (isPlainObject(input)) {
          Object.keys(input).forEach((yearKey) => {
            const numericYear = Number(yearKey);
            if (Number.isInteger(numericYear) && numericYear >= 1900 && numericYear <= 3000) {
              normalizedYearSettings[numericYear] = normalizeYearSettings(input[yearKey]);
            }
          });
        }

        if (Object.keys(normalizedYearSettings).length === 0) {
          normalizedYearSettings[fallbackYear] = normalizeYearSettings({
            baseDays: legacyInput?.baseDays ?? 22,
            birthdayDays: legacyInput?.birthdayDays ?? 1,
            bonusDays: legacyInput?.bonusDays ?? 1,
            carryOverDays: legacyInput?.carryOverDays ?? 4,
            flexTimeDays: legacyInput?.flexTimeDays ?? 0,
          });
        }

        return normalizedYearSettings;
      }

      function getSettingsForYear(state, year) {
        return state.yearSettings?.[year] || getDefaultYearSettings();
      }

      function normalizePlannerState(input) {
        const defaults = getDefaultPlannerState();
        if (!isPlainObject(input)) return defaults;

        const normalizedYear = toSafeNumber(input.year) || defaults.year;
        const rawSelectedDayType = input.selectedDayType || defaults.selectedDayType;
        const rawSelectedStatus = input.selectedStatus || defaults.selectedStatus;

        return {
          ...defaults,
          year: normalizedYear,
          yearSettings: normalizeAllYearSettings(input.yearSettings, normalizedYear, input),
          excludeWeekends:
            typeof input.excludeWeekends === "boolean" ? input.excludeWeekends : defaults.excludeWeekends,
          selectedDates: normalizeSelectedDates(input.selectedDates),
          selectedDayType: Object.values(DAY_TYPES).includes(rawSelectedDayType)
            ? rawSelectedDayType
            : defaults.selectedDayType,
          selectedStatus: Object.values(STATUSES).includes(rawSelectedStatus)
            ? rawSelectedStatus
            : defaults.selectedStatus,
          lastSavedAt: input.lastSavedAt || null,
        };
      }

      function readSavedPlannerState() {
        try {
          const rawValue =
            window.localStorage.getItem(STORAGE_KEY) ||
            LEGACY_STORAGE_KEYS.map((key) => window.localStorage.getItem(key)).find(Boolean);

          if (!rawValue) return getDefaultPlannerState();
          return normalizePlannerState(JSON.parse(rawValue));
        } catch (error) {
          console.warn("Could not read saved vacation planner state:", error);
          return getDefaultPlannerState();
        }
      }

      function savePlannerState(state) {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              ...state,
              lastSavedAt: new Date().toISOString(),
            })
          );
        } catch (error) {
          console.warn("Could not save vacation planner state:", error);
        }
      }

      function clearSavedPlannerState() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
          LEGACY_STORAGE_KEYS.forEach((key) => window.localStorage.removeItem(key));
        } catch (error) {
          console.warn("Could not clear saved planner state:", error);
        }
      }

      function createExportPayload(state) {
        return {
          app: "Vacation Control Calendar",
          version: 5,
          exportedAt: new Date().toISOString(),
          plannerState: normalizePlannerState(state),
        };
      }

      function getImportablePlannerState(parsedJson) {
        if (isPlainObject(parsedJson?.plannerState)) {
          return normalizePlannerState(parsedJson.plannerState);
        }
        return normalizePlannerState(parsedJson);
      }

      function createJsonExport(filename, data) {
        const json = JSON.stringify(data, null, 2);
        const dataUrl = `data:application/json;charset=utf-8,${encodeURIComponent(json)}`;
        return { filename, json, dataUrl };
      }

      function removeWeekendDatesForYear(selectedDates, year) {
        const nextSelectedDates = { ...selectedDates };
        Object.keys(nextSelectedDates).forEach((dateKey) => {
          if (dateKey.startsWith(`${year}-`) && isWeekend(new Date(dateKey))) {
            delete nextSelectedDates[dateKey];
          }
        });
        return nextSelectedDates;
      }

      function formatAmount(value) {
        return Number.isInteger(value) ? String(value) : value.toFixed(1);
      }

      function getTypeShortLabel(type) {
        if (type === DAY_TYPES.VACATION_HALF) return "½";
        if (type === DAY_TYPES.FLEX_TIME) return "F";
        if (type === DAY_TYPES.BIRTHDAY) return "B";
        if (type === DAY_TYPES.BONUS) return "+";
        if (type === DAY_TYPES.HOLIDAY) return "H";
        return "";
      }

      function getTypeListLabel(type) {
        if (type === DAY_TYPES.VACATION_FULL) return "Vacation full day";
        if (type === DAY_TYPES.VACATION_HALF) return "Vacation half day";
        if (type === DAY_TYPES.FLEX_TIME) return "Flex time";
        if (type === DAY_TYPES.BIRTHDAY) return "Birthday day";
        if (type === DAY_TYPES.BONUS) return "Bonus day";
        if (type === DAY_TYPES.HOLIDAY) return "National / Local holiday";
        return type;
      }

      function getColorClassForSelectedDay(dayEntry) {
        if (dayEntry.type === DAY_TYPES.HOLIDAY) {
          return "bg-amber-500 text-white shadow-sm hover:bg-amber-600";
        }
        if (dayEntry.type === DAY_TYPES.FLEX_TIME) {
          return dayEntry.status === STATUSES.CONFIRMED
            ? "bg-orange-700 text-white shadow-sm hover:bg-orange-800"
            : "bg-orange-500 text-white shadow-sm hover:bg-orange-600";
        }
        if (dayEntry.type === DAY_TYPES.BIRTHDAY) {
          return "bg-purple-600 text-white shadow-sm hover:bg-purple-700";
        }
        if (dayEntry.type === DAY_TYPES.BONUS) {
          return "bg-emerald-600 text-white shadow-sm hover:bg-emerald-700";
        }
        if (dayEntry.type === DAY_TYPES.VACATION_HALF) {
          return dayEntry.status === STATUSES.CONFIRMED
            ? "bg-cyan-700 text-white shadow-sm hover:bg-cyan-800"
            : "bg-cyan-500 text-white shadow-sm hover:bg-cyan-600";
        }
        return dayEntry.status === STATUSES.CONFIRMED
          ? "bg-blue-800 text-white shadow-sm hover:bg-blue-900"
          : "bg-blue-600 text-white shadow-sm hover:bg-blue-700";
      }

      function Panel({ children, className = "" }) {
        return (
          <div className={`rounded-3xl border border-slate-200 bg-white shadow-sm ${className}`}>
            {children}
          </div>
        );
      }

      function StatCard({ label, value, subtext, tone = "default", icon }) {
        const toneMap = {
          default: { badge: "bg-slate-100 text-slate-700", value: "text-slate-900" },
          blue: { badge: "bg-blue-100 text-blue-700", value: "text-slate-900" },
          green: { badge: "bg-emerald-100 text-emerald-700", value: "text-emerald-700" },
          red: { badge: "bg-red-100 text-red-700", value: "text-red-600" },
          purple: { badge: "bg-purple-100 text-purple-700", value: "text-purple-700" },
          amber: { badge: "bg-amber-100 text-amber-700", value: "text-amber-700" },
          orange: { badge: "bg-orange-100 text-orange-700", value: "text-orange-700" },
        };
        const styles = toneMap[tone] || toneMap.default;

        return (
          <Panel>
            <div className="p-5">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <p className="text-sm text-slate-500">{label}</p>
                  <p className={`mt-1 text-3xl font-bold ${styles.value}`}>{value}</p>
                  {subtext ? <p className="mt-1 text-sm text-slate-500">{subtext}</p> : null}
                </div>
                <div className={`rounded-2xl px-3 py-2 text-xl ${styles.badge}`}>{icon}</div>
              </div>
            </div>
          </Panel>
        );
      }

      function AllowanceInput({ label, value, onChange, min = 0, max }) {
        return (
          <label className="block">
            <span className="mb-1 block text-sm font-medium text-slate-700">{label}</span>
            <input
              type="number"
              min={min}
              max={max}
              value={value}
              onChange={onChange}
              className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-slate-400 focus:ring-4 focus:ring-slate-100"
            />
          </label>
        );
      }

      function CategoryBalanceRow({ label, available, used, remaining, note }) {
        const isNegative = remaining < 0;

        return (
          <div className={`rounded-xl px-3 py-2 text-sm ${
            isNegative ? "bg-red-50 text-red-800" : "bg-slate-100 text-slate-700"
          }`}>
            <div className="flex items-center justify-between gap-3">
              <span className="font-medium">{label}</span>
              <span className={`font-semibold ${isNegative ? "text-red-700" : "text-slate-900"}`}>
                {formatAmount(remaining)} left
              </span>
            </div>
            <p className="mt-1 text-xs opacity-80">
              Available {formatAmount(available)} · Used {formatAmount(used)}
              {note ? ` · ${note}` : ""}
            </p>
          </div>
        );
      }

      function ChoiceButton({ active, onClick, children, color = "slate" }) {
        const activeClasses = {
          slate: "bg-slate-900 text-white border-slate-900",
          blue: "bg-blue-600 text-white border-blue-600",
          cyan: "bg-cyan-600 text-white border-cyan-600",
          purple: "bg-purple-600 text-white border-purple-600",
          emerald: "bg-emerald-600 text-white border-emerald-600",
          amber: "bg-amber-500 text-white border-amber-500",
          orange: "bg-orange-500 text-white border-orange-500",
        };

        return (
          <button
            onClick={onClick}
            className={`rounded-2xl border px-4 py-3 text-left text-sm font-medium transition ${
              active
                ? activeClasses[color]
                : "border-slate-200 bg-white text-slate-700 hover:bg-slate-50"
            }`}
          >
            {children}
          </button>
        );
      }

      function MonthCalendar({
        year,
        monthIndex,
        monthName,
        selectedDates,
        onDateClick,
        excludeWeekends,
        selectedCount,
        holidayCount,
      }) {
        const daysInMonth = getDaysInMonth(year, monthIndex);
        const startOffset = getMondayBasedStartOffset(year, monthIndex);
        const calendarCells = [];

        for (let i = 0; i < startOffset; i += 1) calendarCells.push(null);
        for (let day = 1; day <= daysInMonth; day += 1) {
          calendarCells.push(new Date(year, monthIndex, day));
        }

        return (
          <Panel>
            <div className="p-4">
              <div className="mb-4 flex items-center justify-between gap-3">
                <div>
                  <h3 className="text-lg font-semibold">{monthName}</h3>
                  <p className="text-xs text-slate-500">
                    {formatAmount(selectedCount)} counted day(s)
                    {holidayCount > 0 ? ` · ${holidayCount} holiday(s)` : ""}
                  </p>
                </div>
                {selectedCount > 0 ? (
                  <div className="rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-800">
                    {formatAmount(selectedCount)} used
                  </div>
                ) : null}
              </div>

              <div className="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400">
                {WEEKDAYS.map((weekday) => (
                  <div key={weekday} className="py-1">{weekday}</div>
                ))}
              </div>

              <div className="mt-1 grid grid-cols-7 gap-1">
                {calendarCells.map((date, index) => {
                  if (!date) return <div key={`empty-${index}`} className="aspect-square" />;

                  const key = formatDateKey(date);
                  const selectedEntry = selectedDates[key];
                  const selected = Boolean(selectedEntry);
                  const weekend = isWeekend(date);
                  const disabledByWeekend = excludeWeekends && weekend;

                  let className = "relative aspect-square rounded-xl text-sm font-medium transition ";

                  if (selected) {
                    className += getColorClassForSelectedDay(selectedEntry);
                  } else if (disabledByWeekend) {
                    className += "cursor-not-allowed bg-slate-100 text-slate-300";
                  } else if (weekend) {
                    className += "bg-slate-50 text-slate-400 hover:bg-slate-100";
                  } else {
                    className += "bg-white text-slate-700 ring-1 ring-slate-100 hover:bg-blue-50 hover:text-blue-700 hover:ring-blue-200";
                  }

                  return (
                    <button
                      key={key}
                      onClick={() => onDateClick(date)}
                      disabled={disabledByWeekend}
                      title={
                        disabledByWeekend
                          ? "Weekend excluded"
                          : selected
                            ? `${getTypeListLabel(selectedEntry.type)} · ${selectedEntry.status} · Click to remove`
                            : "Click to add selected day type"
                      }
                      className={className}
                    >
                      {date.getDate()}
                      {selectedEntry ? (
                        <span className="absolute right-1 top-0.5 text-[10px] font-bold">
                          {getTypeShortLabel(selectedEntry.type)}
                        </span>
                      ) : null}
                    </button>
                  );
                })}
              </div>
            </div>
          </Panel>
        );
      }

      function VacationCalendarPlanner() {
        const fileInputRef = useRef(null);
        const jsonTextAreaRef = useRef(null);
        const [plannerState, setPlannerState] = useState(() => readSavedPlannerState());
        const [importExportMessage, setImportExportMessage] = useState("");
        const [exportBackup, setExportBackup] = useState(null);

        const {
          year,
          excludeWeekends,
          selectedDates,
          selectedDayType,
          selectedStatus,
          lastSavedAt,
        } = plannerState;

        const currentYearSettings = getSettingsForYear(plannerState, year);
        const { baseDays, birthdayDays, bonusDays, carryOverDays, flexTimeDays } = currentYearSettings;

        useEffect(() => {
          savePlannerState(plannerState);
        }, [plannerState]);

        function updatePlannerState(partialState) {
          setPlannerState((previous) => ({ ...previous, ...partialState }));
        }

        function updateYearSettings(fieldName, value) {
          setPlannerState((previous) => {
            const currentSettings = getSettingsForYear(previous, previous.year);
            const normalizedValue = fieldName === "birthdayDays"
              ? clampNumber(value, 0, 1)
              : Math.max(0, toSafeNumber(value));

            return {
              ...previous,
              yearSettings: {
                ...previous.yearSettings,
                [previous.year]: {
                  ...currentSettings,
                  [fieldName]: normalizedValue,
                },
              },
            };
          });
        }

        const totalAvailable = useMemo(() => {
          return (
            toSafeNumber(baseDays) +
            toSafeNumber(birthdayDays) +
            toSafeNumber(bonusDays) +
            toSafeNumber(carryOverDays) +
            toSafeNumber(flexTimeDays)
          );
        }, [baseDays, birthdayDays, bonusDays, carryOverDays, flexTimeDays]);

        const yearDateList = useMemo(() => {
          return Object.keys(selectedDates)
            .filter((dateKey) => dateKey.startsWith(`${year}-`))
            .sort();
        }, [selectedDates, year]);

        const countedDateList = useMemo(() => {
          return yearDateList.filter((dateKey) => isCountedDay(selectedDates[dateKey]));
        }, [yearDateList, selectedDates]);

        const holidayDateList = useMemo(() => {
          return yearDateList.filter((dateKey) => selectedDates[dateKey]?.type === DAY_TYPES.HOLIDAY);
        }, [yearDateList, selectedDates]);

        const daysUsed = useMemo(() => {
          return countedDateList.reduce((sum, dateKey) => {
            return sum + toSafeNumber(selectedDates[dateKey]?.amount || 1);
          }, 0);
        }, [countedDateList, selectedDates]);

        const birthdayUsed = useMemo(() => {
          return countedDateList.some((dateKey) => selectedDates[dateKey]?.type === DAY_TYPES.BIRTHDAY) ? 1 : 0;
        }, [countedDateList, selectedDates]);

        const categoryBalanceRows = useMemo(() => {
          const sumByType = (types) => {
            return countedDateList.reduce((sum, dateKey) => {
              const entry = selectedDates[dateKey];
              if (!entry || !types.includes(entry.type)) return sum;
              return sum + toSafeNumber(entry.amount || 1);
            }, 0);
          };

          const normalVacationUsed = sumByType([
            DAY_TYPES.VACATION_FULL,
            DAY_TYPES.VACATION_HALF,
          ]);

          const carryOverUsed = Math.min(toSafeNumber(carryOverDays), normalVacationUsed);
          const baseVacationUsed = Math.max(0, normalVacationUsed - toSafeNumber(carryOverDays));

          const flexTimeUsed = sumByType([DAY_TYPES.FLEX_TIME]);
          const birthdayUsedAmount = sumByType([DAY_TYPES.BIRTHDAY]);
          const bonusUsed = sumByType([DAY_TYPES.BONUS]);

          return [
            {
              label: "Carry-over from last year",
              available: toSafeNumber(carryOverDays),
              used: carryOverUsed,
              remaining: toSafeNumber(carryOverDays) - carryOverUsed,
              note: "used first by vacation days",
            },
            {
              label: "This year vacation",
              available: toSafeNumber(baseDays),
              used: baseVacationUsed,
              remaining: toSafeNumber(baseDays) - baseVacationUsed,
              note: "used after carry-over",
            },
            {
              label: "Flex time",
              available: toSafeNumber(flexTimeDays),
              used: flexTimeUsed,
              remaining: toSafeNumber(flexTimeDays) - flexTimeUsed,
            },
            {
              label: "Birthday day",
              available: toSafeNumber(birthdayDays),
              used: birthdayUsedAmount,
              remaining: toSafeNumber(birthdayDays) - birthdayUsedAmount,
            },
            {
              label: "Bonus days",
              available: toSafeNumber(bonusDays),
              used: bonusUsed,
              remaining: toSafeNumber(bonusDays) - bonusUsed,
            },
          ];
        }, [
          countedDateList,
          selectedDates,
          baseDays,
          birthdayDays,
          bonusDays,
          carryOverDays,
          flexTimeDays,
        ]);

        const remainingDays = totalAvailable - daysUsed;

        const vacationByMonth = useMemo(() => {
          return countedDateList.reduce((acc, dateKey) => {
            const month = Number(dateKey.slice(5, 7)) - 1;
            acc[month] = (acc[month] || 0) + toSafeNumber(selectedDates[dateKey]?.amount || 1);
            return acc;
          }, {});
        }, [countedDateList, selectedDates]);

        const holidaysByMonth = useMemo(() => {
          return holidayDateList.reduce((acc, dateKey) => {
            const month = Number(dateKey.slice(5, 7)) - 1;
            acc[month] = (acc[month] || 0) + 1;
            return acc;
          }, {});
        }, [holidayDateList]);

        const monthlySummary = useMemo(() => {
          return MONTH_NAMES.map((monthName, monthIndex) => ({
            monthName,
            amount: vacationByMonth[monthIndex] || 0,
            holidays: holidaysByMonth[monthIndex] || 0,
          })).filter((row) => row.amount > 0 || row.holidays > 0);
        }, [vacationByMonth, holidaysByMonth]);

        const yearlyTypeSummary = useMemo(() => {
          return yearDateList.reduce((acc, dateKey) => {
            const entry = selectedDates[dateKey];
            if (!entry) return acc;
            acc[entry.type] = (acc[entry.type] || 0) + (entry.type === DAY_TYPES.HOLIDAY ? 1 : toSafeNumber(entry.amount || 1));
            return acc;
          }, {});
        }, [yearDateList, selectedDates]);

        function toggleDate(date) {
          const key = formatDateKey(date);
          if (excludeWeekends && isWeekend(date)) return;

          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };

            if (nextSelectedDates[key]) {
              delete nextSelectedDates[key];
              return { ...previous, selectedDates: nextSelectedDates };
            }

            if (previous.selectedDayType === DAY_TYPES.BIRTHDAY) {
              Object.keys(nextSelectedDates).forEach((dateKey) => {
                if (
                  dateKey.startsWith(`${previous.year}-`) &&
                  nextSelectedDates[dateKey]?.type === DAY_TYPES.BIRTHDAY
                ) {
                  delete nextSelectedDates[dateKey];
                }
              });
            }

            nextSelectedDates[key] = {
              type: previous.selectedDayType,
              amount: getDayAmount(previous.selectedDayType),
              status: previous.selectedDayType === DAY_TYPES.HOLIDAY ? STATUSES.CONFIRMED : previous.selectedStatus,
            };

            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function changeYear(nextYear) {
          setPlannerState((previous) => {
            const existingSettings = previous.yearSettings?.[nextYear];
            return {
              ...previous,
              year: nextYear,
              yearSettings: {
                ...previous.yearSettings,
                [nextYear]: existingSettings || getDefaultYearSettings(),
              },
            };
          });
        }

        function toggleExcludeWeekends(checked) {
          setPlannerState((previous) => ({
            ...previous,
            excludeWeekends: checked,
            selectedDates: checked
              ? removeWeekendDatesForYear(previous.selectedDates, previous.year)
              : previous.selectedDates,
          }));
        }

        function clearCalendarForCurrentYear() {
          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };
            Object.keys(nextSelectedDates).forEach((dateKey) => {
              if (dateKey.startsWith(`${previous.year}-`)) delete nextSelectedDates[dateKey];
            });
            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function resetCurrentYearAllowance() {
          setPlannerState((previous) => ({
            ...previous,
            yearSettings: { ...previous.yearSettings, [previous.year]: getDefaultYearSettings() },
          }));
        }

        function resetEverything() {
          clearSavedPlannerState();
          setPlannerState(getDefaultPlannerState());
          setExportBackup(null);
          setImportExportMessage("Planner reset to the default setup.");
        }

        function removeSelectedDate(dateKey) {
          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };
            delete nextSelectedDates[dateKey];
            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function handleNumericInput(fieldName) {
          return (event) => updateYearSettings(fieldName, event.target.value === "" ? 0 : Number(event.target.value));
        }

        function exportPlannerJson() {
          const payload = createExportPayload(plannerState);
          const filename = `${BACKUP_FILE_PREFIX}-backup.json`;
          const preparedExport = createJsonExport(filename, payload);
          setExportBackup(preparedExport);
          setImportExportMessage(
            `Full backup prepared: ${filename}. This includes selected dates, holidays, day types, statuses and allowance settings for all saved years. If downloads are blocked, select the JSON text and copy it manually.`
          );
        }

        function selectExportJsonText() {
          if (!jsonTextAreaRef.current) return;
          jsonTextAreaRef.current.focus();
          jsonTextAreaRef.current.select();
          setImportExportMessage("JSON text selected. Press Ctrl+C to copy it manually if the download link is blocked.");
        }

        function openImportDialog() {
          if (fileInputRef.current) {
            fileInputRef.current.value = "";
            fileInputRef.current.click();
          }
        }

        function importPlannerJson(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsedJson = JSON.parse(String(reader.result));
              const importedState = getImportablePlannerState(parsedJson);
              setPlannerState(importedState);
              setExportBackup(null);
              setImportExportMessage(`Imported ${file.name}. The planner was updated and saved in this browser.`);
            } catch (error) {
              console.error("Could not import JSON file:", error);
              setImportExportMessage("Import failed. Please select a valid vacation planner JSON file.");
            }
          };
          reader.onerror = () => setImportExportMessage("Import failed. The file could not be read.");
          reader.readAsText(file);
        }

        const balanceTone = remainingDays < 0 ? "red" : "green";
        const readableLastSavedAt = lastSavedAt
          ? new Date(lastSavedAt).toLocaleString()
          : "Automatically saved in this browser";

        return (
          <div className="min-h-screen bg-slate-50 p-4 text-slate-900 md:p-8">
            <div className="mx-auto max-w-7xl space-y-6">
              <header className="overflow-hidden rounded-3xl bg-gradient-to-r from-slate-950 via-slate-900 to-slate-800 p-6 text-white shadow-xl md:p-8">
                <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                  <div>
                    <div className="mb-3 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-sm text-slate-200 ring-1 ring-white/15">
                      <span role="img" aria-label="calendar">📅</span>
                      Interactive annual planner
                    </div>
                    <h1 className="text-3xl font-semibold tracking-tight md:text-5xl">Vacation Control Calendar</h1>
                    <p className="mt-3 max-w-2xl text-sm leading-6 text-slate-300 md:text-base">
                      Select vacation, flex time, birthday, bonus and holiday days directly on the calendar and instantly see the impact on your yearly balance.
                    </p>
                    <div className="mt-3 flex flex-wrap gap-2">
                      <p className="inline-flex rounded-full bg-emerald-400/10 px-3 py-1 text-xs font-medium text-emerald-200 ring-1 ring-emerald-300/20">Auto-save enabled</p>
                      <p className="inline-flex rounded-full bg-blue-400/10 px-3 py-1 text-xs font-medium text-blue-200 ring-1 ring-blue-300/20">Full JSON backup</p>
                      <p className="inline-flex rounded-full bg-orange-400/10 px-3 py-1 text-xs font-medium text-orange-200 ring-1 ring-orange-300/20">Flex time included</p>
                      <p className="inline-flex rounded-full bg-purple-400/10 px-3 py-1 text-xs font-medium text-purple-200 ring-1 ring-purple-300/20">Birthday locked to 1 day</p>
                      <p className="inline-flex rounded-full bg-amber-400/10 px-3 py-1 text-xs font-medium text-amber-200 ring-1 ring-amber-300/20">Manual holidays</p>
                    </div>
                  </div>

                  <div className="rounded-2xl bg-white/10 p-4 ring-1 ring-white/15 backdrop-blur">
                    <label className="mb-2 block text-xs font-medium uppercase tracking-wide text-slate-300">Planning year</label>
                    <input
                      type="number"
                      value={year}
                      onChange={(event) => changeYear(Number(event.target.value))}
                      className="w-32 rounded-xl border border-white/20 bg-white px-3 py-2 text-lg font-semibold text-slate-950 outline-none focus:ring-2 focus:ring-white/40"
                    />
                  </div>
                </div>
              </header>

              <section className="grid gap-4 md:grid-cols-5">
                <StatCard label="Total available" value={formatAmount(totalAvailable)} icon="➕" tone="default" subtext={`Allowance for ${year}`} />
                <StatCard label="Scheduled" value={formatAmount(daysUsed)} icon="✈️" tone="blue" subtext={`Counted days in ${year}`} />
                <StatCard label="Remaining" value={formatAmount(remainingDays)} icon="🎁" tone={balanceTone} subtext={`Balance for ${year}`} />
                <StatCard label="Birthday used" value={`${birthdayUsed}/${birthdayDays}`} icon="🎂" tone="purple" subtext={birthdayUsed ? "Birthday date selected" : "No birthday date selected"} />
                <StatCard label="Holidays" value={holidayDateList.length} icon="🏖️" tone="amber" subtext={`Non-counted in ${year}`} />
              </section>

              <section className="grid gap-6 lg:grid-cols-[360px_1fr]">
                <aside className="space-y-6">
                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Day to add</h2>
                        <p className="mt-1 text-sm text-slate-500">Choose the type and status, then click a day on the calendar.</p>
                      </div>
                      <div className="grid gap-2">
                        <ChoiceButton active={selectedDayType === DAY_TYPES.VACATION_FULL} color="blue" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.VACATION_FULL })}>Vacation full day · 1 day</ChoiceButton>
                        <ChoiceButton active={selectedDayType === DAY_TYPES.VACATION_HALF} color="cyan" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.VACATION_HALF })}>Vacation half day · 0.5 day</ChoiceButton>
                        <ChoiceButton active={selectedDayType === DAY_TYPES.FLEX_TIME} color="orange" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.FLEX_TIME })}>Flex time · 1 day</ChoiceButton>
                        <ChoiceButton active={selectedDayType === DAY_TYPES.BIRTHDAY} color="purple" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.BIRTHDAY })}>Birthday day · locked to 1 per year</ChoiceButton>
                        <ChoiceButton active={selectedDayType === DAY_TYPES.BONUS} color="emerald" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.BONUS })}>Bonus day · 1 day</ChoiceButton>
                        <ChoiceButton active={selectedDayType === DAY_TYPES.HOLIDAY} color="amber" onClick={() => updatePlannerState({ selectedDayType: DAY_TYPES.HOLIDAY })}>National / Local holiday · does not reduce balance</ChoiceButton>
                      </div>
                      {selectedDayType !== DAY_TYPES.HOLIDAY ? (
                        <div className="grid grid-cols-2 gap-2">
                          <ChoiceButton active={selectedStatus === STATUSES.PLANNED} onClick={() => updatePlannerState({ selectedStatus: STATUSES.PLANNED })}>Planned</ChoiceButton>
                          <ChoiceButton active={selectedStatus === STATUSES.CONFIRMED} onClick={() => updatePlannerState({ selectedStatus: STATUSES.CONFIRMED })}>Confirmed</ChoiceButton>
                        </div>
                      ) : (
                        <p className="rounded-2xl bg-amber-50 p-4 text-sm text-amber-800 ring-1 ring-amber-100">
                          Holidays are shown in amber and are not subtracted from your vacation balance.
                        </p>
                      )}
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Allowance input for {year}</h2>
                        <p className="mt-1 text-sm text-slate-500">These values are saved separately for each selected year.</p>
                      </div>
                      <div className="space-y-3">
                        <AllowanceInput label="Base vacation days" value={baseDays} onChange={handleNumericInput("baseDays")} />
                        <AllowanceInput label="Birthday day" value={birthdayDays} max={1} onChange={handleNumericInput("birthdayDays")} />
                        <AllowanceInput label="Bonus days" value={bonusDays} onChange={handleNumericInput("bonusDays")} />
                        <AllowanceInput label="Carry-over from last year" value={carryOverDays} onChange={handleNumericInput("carryOverDays")} />
                        <AllowanceInput label="Flex time days" value={flexTimeDays} onChange={handleNumericInput("flexTimeDays")} />
                      </div>
                      <div className="rounded-2xl bg-slate-100 p-4">
                        <div className="flex items-start gap-3">
                          <span className="mt-0.5 text-lg">ℹ️</span>
                          <div>
                            <p className="text-sm font-medium">Current setup for {year}</p>
                            <p className="mt-1 text-sm text-slate-600">
                              {baseDays} base + {carryOverDays} carry-over + {flexTimeDays} flex time + {birthdayDays} birthday + {bonusDays} bonus = {formatAmount(totalAvailable)} total days.
                            </p>
                            <p className="mt-1 text-xs text-slate-500">
                              Balance split assumes vacation days use carry-over first, then this year vacation.
                            </p>
                          </div>
                        </div>
                      </div>
                      <button onClick={resetCurrentYearAllowance} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Reset allowance for {year}</button>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Calendar rules</h2>
                        <p className="mt-1 text-sm text-slate-500">Control how clicked days are counted.</p>
                      </div>
                      <label className="flex cursor-pointer items-center justify-between rounded-2xl bg-slate-100 p-4">
                        <span>
                          <span className="block text-sm font-medium">Exclude weekends</span>
                          <span className="block text-xs text-slate-500">Saturday and Sunday cannot be selected.</span>
                        </span>
                        <input type="checkbox" checked={excludeWeekends} onChange={(event) => toggleExcludeWeekends(event.target.checked)} className="h-5 w-5 accent-slate-900" />
                      </label>
                      <p className="rounded-2xl bg-slate-100 p-4 text-xs text-slate-600">
                        Holidays are added manually through the “Day to add” section. Use the National / Local holiday type for public, local or company non-working days.
                      </p>
                      <button onClick={clearCalendarForCurrentYear} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">↺ Clear selected days for {year}</button>
                      <button onClick={resetEverything} className="w-full rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700 transition hover:bg-red-100">Reset everything</button>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Summary for {year}</h2>
                        <p className="mt-1 text-sm text-slate-500">Quick overview by balance category, type and month.</p>
                      </div>

                      <div className="space-y-2">
                        <h3 className="text-sm font-semibold text-slate-700">Balance by category</h3>
                        {categoryBalanceRows.map((row) => (
                          <CategoryBalanceRow
                            key={row.label}
                            label={row.label}
                            available={row.available}
                            used={row.used}
                            remaining={row.remaining}
                            note={row.note}
                          />
                        ))}
                      </div>

                      <div className="space-y-2 text-sm">
                        <h3 className="pt-2 text-sm font-semibold text-slate-700">Selected days by type</h3>
                        {Object.keys(yearlyTypeSummary).length === 0 ? (
                          <p className="rounded-2xl bg-slate-100 p-4 text-slate-500">No selected days yet.</p>
                        ) : (
                          Object.entries(yearlyTypeSummary).map(([type, amount]) => (
                            <div key={type} className={`flex justify-between rounded-xl px-3 py-2 ${type === DAY_TYPES.HOLIDAY ? "bg-amber-50 text-amber-900" : "bg-slate-100"}`}>
                              <span>{getTypeListLabel(type)}</span>
                              <span className="font-semibold">{formatAmount(amount)}</span>
                            </div>
                          ))
                        )}
                      </div>

                      <div className="space-y-2 text-sm">
                        <h3 className="pt-2 text-sm font-semibold text-slate-700">Selected days by month</h3>
                        {monthlySummary.length === 0 ? (
                          <p className="rounded-2xl bg-slate-100 p-4 text-slate-500">No monthly activity yet.</p>
                        ) : (
                          monthlySummary.map((row) => (
                            <div key={row.monthName} className="flex justify-between rounded-xl bg-blue-50 px-3 py-2 text-blue-950">
                              <span>{row.monthName}</span>
                              <span className="font-semibold">
                                {row.amount > 0 ? `${formatAmount(row.amount)} day(s)` : ""}
                                {row.amount > 0 && row.holidays > 0 ? " · " : ""}
                                {row.holidays > 0 ? `${row.holidays} holiday(s)` : ""}
                              </span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Backup and transfer</h2>
                        <p className="mt-1 text-sm text-slate-500">Export your full planner to a JSON file, including all saved years, move it to another device, and import it there.</p>
                      </div>
                      <button onClick={exportPlannerJson} className="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-slate-800">⬇ Export full JSON backup</button>
                      <button onClick={openImportDialog} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">⬆ Import JSON backup</button>
                      {exportBackup ? (
                        <div className="space-y-3 rounded-2xl bg-slate-100 p-4">
                          <a href={exportBackup.dataUrl} download={exportBackup.filename} className="block rounded-xl bg-blue-600 px-4 py-3 text-center text-sm font-medium text-white transition hover:bg-blue-700">Download {exportBackup.filename}</a>
                          <button onClick={selectExportJsonText} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Select JSON text</button>
                          <textarea ref={jsonTextAreaRef} readOnly value={exportBackup.json} className="h-36 w-full rounded-xl border border-slate-200 bg-white p-3 font-mono text-xs text-slate-700 outline-none" />
                        </div>
                      ) : null}
                      <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={importPlannerJson} className="hidden" />
                      {importExportMessage ? (
                        <p className="rounded-2xl bg-blue-50 p-4 text-sm text-blue-800">{importExportMessage}</p>
                      ) : (
                        <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-600">Tip: after making changes in any year, export a new JSON file so your backup contains the full latest plan.</p>
                      )}
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-3 p-5">
                      <h2 className="text-lg font-semibold">Save status</h2>
                      <p className="rounded-2xl bg-emerald-50 p-4 text-sm text-emerald-800">Your planner is saved automatically in this browser. Use JSON export/import to move the same full plan between devices or browsers.</p>
                      <p className="text-xs text-slate-500">Last loaded/saved: {readableLastSavedAt}</p>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="p-5">
                      <h2 className="text-lg font-semibold">Selected days in {year}</h2>
                      <div className="mt-4 max-h-80 space-y-2 overflow-auto pr-1">
                        {yearDateList.length === 0 ? (
                          <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-500">No days selected for {year} yet. Click days in the calendar to add them.</p>
                        ) : (
                          yearDateList.map((dateKey) => {
                            const entry = selectedDates[dateKey];
                            return (
                              <div key={dateKey} className={`rounded-2xl px-4 py-3 text-sm ${entry.type === DAY_TYPES.HOLIDAY ? "bg-amber-50" : "bg-blue-50"}`}>
                                <div className="flex items-center justify-between gap-3">
                                  <div>
                                    <p className={entry.type === DAY_TYPES.HOLIDAY ? "font-medium text-amber-950" : "font-medium text-blue-950"}>{dateKey}</p>
                                    <p className={entry.type === DAY_TYPES.HOLIDAY ? "text-xs text-amber-700" : "text-xs text-blue-700"}>
                                      {getTypeListLabel(entry.type)} · {entry.type === DAY_TYPES.HOLIDAY ? "Non-counted" : `${entry.status} · ${formatAmount(entry.amount)} day(s)`}
                                    </p>
                                  </div>
                                  <button onClick={() => removeSelectedDate(dateKey)} className={`rounded-full px-2 py-1 text-xs font-medium ${entry.type === DAY_TYPES.HOLIDAY ? "text-amber-700 hover:bg-amber-100" : "text-blue-700 hover:bg-blue-100"}`}>Remove</button>
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  </Panel>
                </aside>

                <main className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  {MONTH_NAMES.map((monthName, monthIndex) => (
                    <MonthCalendar
                      key={`${year}-${monthIndex}`}
                      year={year}
                      monthIndex={monthIndex}
                      monthName={monthName}
                      selectedDates={selectedDates}
                      onDateClick={toggleDate}
                      excludeWeekends={excludeWeekends}
                      selectedCount={vacationByMonth[monthIndex] || 0}
                      holidayCount={holidaysByMonth[monthIndex] || 0}
                    />
                  ))}
                </main>
              </section>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<VacationCalendarPlanner />);
    </script>
  </body>
</html>
