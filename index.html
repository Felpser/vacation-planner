<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacation Control Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const STORAGE_KEY = "vacation-calendar-planner-v2";
      const LEGACY_STORAGE_KEY = "vacation-calendar-planner-v1";
      const BACKUP_FILE_PREFIX = "vacation-planner";

      const MONTH_NAMES = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December",
      ];

      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      function formatDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function dateFromKey(dateKey) {
        return new Date(
          Number(dateKey.slice(0, 4)),
          Number(dateKey.slice(5, 7)) - 1,
          Number(dateKey.slice(8, 10))
        );
      }

      function addDays(date, numberOfDays) {
        const nextDate = new Date(date);
        nextDate.setDate(nextDate.getDate() + numberOfDays);
        return nextDate;
      }

      function getDaysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
      }

      function getMondayBasedStartOffset(year, monthIndex) {
        const jsDay = new Date(year, monthIndex, 1).getDay();
        return jsDay === 0 ? 6 : jsDay - 1;
      }

      function isWeekend(date) {
        const day = date.getDay();
        return day === 0 || day === 6;
      }

      function toSafeNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      }

      function isPlainObject(value) {
        return typeof value === "object" && value !== null && !Array.isArray(value);
      }

      function isValidDateKey(dateKey) {
        if (typeof dateKey !== "string") return false;
        if (dateKey.length !== 10) return false;
        if (dateKey[4] !== "-" || dateKey[7] !== "-") return false;

        const year = Number(dateKey.slice(0, 4));
        const month = Number(dateKey.slice(5, 7));
        const day = Number(dateKey.slice(8, 10));

        if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day)) return false;
        if (month < 1 || month > 12) return false;
        if (day < 1 || day > getDaysInMonth(year, month - 1)) return false;

        return true;
      }

      function getEasterSunday(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
      }

      function getPortugalNationalHolidays(year) {
        const easterSunday = getEasterSunday(year);
        return {
          [`${year}-01-01`]: "New Year's Day",
          [formatDateKey(addDays(easterSunday, -2))]: "Good Friday",
          [formatDateKey(easterSunday)]: "Easter Sunday",
          [`${year}-04-25`]: "Freedom Day",
          [`${year}-05-01`]: "Labour Day",
          [formatDateKey(addDays(easterSunday, 60))]: "Corpus Christi",
          [`${year}-06-10`]: "Portugal Day",
          [`${year}-08-15`]: "Assumption of Mary",
          [`${year}-10-05`]: "Republic Day",
          [`${year}-11-01`]: "All Saints' Day",
          [`${year}-12-01`]: "Restoration of Independence",
          [`${year}-12-08`]: "Immaculate Conception",
          [`${year}-12-25`]: "Christmas Day",
        };
      }

      function getDefaultYearSettings() {
        return {
          baseDays: 22,
          birthdayDays: 1,
          bonusDays: 1,
          carryOverDays: 4,
        };
      }

      function normalizeYearSettings(input) {
        const defaults = getDefaultYearSettings();
        if (!isPlainObject(input)) return defaults;

        return {
          baseDays: toSafeNumber(input.baseDays),
          birthdayDays: toSafeNumber(input.birthdayDays),
          bonusDays: toSafeNumber(input.bonusDays),
          carryOverDays: toSafeNumber(input.carryOverDays),
        };
      }

      function getDefaultPlannerState() {
        const currentYear = new Date().getFullYear();
        return {
          year: currentYear,
          yearSettings: {
            [currentYear]: getDefaultYearSettings(),
          },
          excludeWeekends: true,
          excludePortugalHolidays: false,
          selectedDates: {},
          lastSavedAt: null,
        };
      }

      function normalizeSelectedDates(selectedDates) {
        if (!isPlainObject(selectedDates)) return {};

        return Object.keys(selectedDates).reduce((acc, dateKey) => {
          if (!isValidDateKey(dateKey)) return acc;
          acc[dateKey] = {
            type: selectedDates[dateKey]?.type || "Vacation",
          };
          return acc;
        }, {});
      }

      function normalizeAllYearSettings(input, fallbackYear, legacyInput) {
        const normalizedYearSettings = {};

        if (isPlainObject(input)) {
          Object.keys(input).forEach((yearKey) => {
            const numericYear = Number(yearKey);
            if (Number.isInteger(numericYear) && numericYear >= 1900 && numericYear <= 3000) {
              normalizedYearSettings[numericYear] = normalizeYearSettings(input[yearKey]);
            }
          });
        }

        if (Object.keys(normalizedYearSettings).length === 0) {
          normalizedYearSettings[fallbackYear] = normalizeYearSettings({
            baseDays: legacyInput?.baseDays ?? 22,
            birthdayDays: legacyInput?.birthdayDays ?? 1,
            bonusDays: legacyInput?.bonusDays ?? 1,
            carryOverDays: legacyInput?.carryOverDays ?? 4,
          });
        }

        return normalizedYearSettings;
      }

      function getSettingsForYear(state, year) {
        return state.yearSettings?.[year] || getDefaultYearSettings();
      }

      function normalizePlannerState(input) {
        const defaults = getDefaultPlannerState();
        if (!isPlainObject(input)) return defaults;

        const normalizedYear = toSafeNumber(input.year) || defaults.year;

        return {
          ...defaults,
          year: normalizedYear,
          yearSettings: normalizeAllYearSettings(input.yearSettings, normalizedYear, input),
          excludeWeekends:
            typeof input.excludeWeekends === "boolean" ? input.excludeWeekends : defaults.excludeWeekends,
          excludePortugalHolidays:
            typeof input.excludePortugalHolidays === "boolean"
              ? input.excludePortugalHolidays
              : defaults.excludePortugalHolidays,
          selectedDates: normalizeSelectedDates(input.selectedDates),
          lastSavedAt: input.lastSavedAt || null,
        };
      }

      function readSavedPlannerState() {
        try {
          const rawValue =
            window.localStorage.getItem(STORAGE_KEY) ||
            window.localStorage.getItem(LEGACY_STORAGE_KEY);

          if (!rawValue) return getDefaultPlannerState();
          return normalizePlannerState(JSON.parse(rawValue));
        } catch (error) {
          console.warn("Could not read saved vacation planner state:", error);
          return getDefaultPlannerState();
        }
      }

      function savePlannerState(state) {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              ...state,
              lastSavedAt: new Date().toISOString(),
            })
          );
        } catch (error) {
          console.warn("Could not save vacation planner state:", error);
        }
      }

      function clearSavedPlannerState() {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
          window.localStorage.removeItem(LEGACY_STORAGE_KEY);
        } catch (error) {
          console.warn("Could not clear saved vacation planner state:", error);
        }
      }

      function createExportPayload(state) {
        return {
          app: "Vacation Control Calendar",
          version: 2,
          exportedAt: new Date().toISOString(),
          plannerState: normalizePlannerState(state),
        };
      }

      function getImportablePlannerState(parsedJson) {
        if (isPlainObject(parsedJson?.plannerState)) {
          return normalizePlannerState(parsedJson.plannerState);
        }
        return normalizePlannerState(parsedJson);
      }

      function createJsonExport(filename, data) {
        const json = JSON.stringify(data, null, 2);
        const dataUrl = `data:application/json;charset=utf-8,${encodeURIComponent(json)}`;
        return { filename, json, dataUrl };
      }

      function isBlockedDate(dateKey, options) {
        const date = dateFromKey(dateKey);
        if (options.excludeWeekends && isWeekend(date)) return true;
        if (options.excludePortugalHolidays && options.portugalHolidays[dateKey]) return true;
        return false;
      }

      function removeBlockedDatesForYear(selectedDates, year, options) {
        const nextSelectedDates = { ...selectedDates };
        Object.keys(nextSelectedDates).forEach((dateKey) => {
          if (dateKey.startsWith(`${year}-`) && isBlockedDate(dateKey, options)) {
            delete nextSelectedDates[dateKey];
          }
        });
        return nextSelectedDates;
      }

      function Panel({ children, className = "" }) {
        return (
          <div className={`rounded-3xl border border-slate-200 bg-white shadow-sm ${className}`}>
            {children}
          </div>
        );
      }

      function StatCard({ label, value, subtext, tone = "default", icon }) {
        const toneMap = {
          default: { badge: "bg-slate-100 text-slate-700", value: "text-slate-900" },
          blue: { badge: "bg-blue-100 text-blue-700", value: "text-slate-900" },
          green: { badge: "bg-emerald-100 text-emerald-700", value: "text-emerald-700" },
          red: { badge: "bg-red-100 text-red-700", value: "text-red-600" },
        };
        const styles = toneMap[tone] || toneMap.default;

        return (
          <Panel>
            <div className="p-5">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <p className="text-sm text-slate-500">{label}</p>
                  <p className={`mt-1 text-3xl font-bold ${styles.value}`}>{value}</p>
                  {subtext ? <p className="mt-1 text-sm text-slate-500">{subtext}</p> : null}
                </div>
                <div className={`rounded-2xl px-3 py-2 text-xl ${styles.badge}`}>{icon}</div>
              </div>
            </div>
          </Panel>
        );
      }

      function AllowanceInput({ label, value, onChange }) {
        return (
          <label className="block">
            <span className="mb-1 block text-sm font-medium text-slate-700">{label}</span>
            <input
              type="number"
              min="0"
              value={value}
              onChange={onChange}
              className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-slate-400 focus:ring-4 focus:ring-slate-100"
            />
          </label>
        );
      }

      function MonthCalendar({
        year,
        monthIndex,
        monthName,
        selectedDates,
        onDateClick,
        excludeWeekends,
        excludePortugalHolidays,
        portugalHolidays,
        selectedCount,
      }) {
        const daysInMonth = getDaysInMonth(year, monthIndex);
        const startOffset = getMondayBasedStartOffset(year, monthIndex);
        const calendarCells = [];

        for (let i = 0; i < startOffset; i += 1) calendarCells.push(null);
        for (let day = 1; day <= daysInMonth; day += 1) {
          calendarCells.push(new Date(year, monthIndex, day));
        }

        return (
          <Panel>
            <div className="p-4">
              <div className="mb-4 flex items-center justify-between gap-3">
                <div>
                  <h3 className="text-lg font-semibold">{monthName}</h3>
                  <p className="text-xs text-slate-500">{selectedCount} vacation day(s)</p>
                </div>
                {selectedCount > 0 ? (
                  <div className="rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-800">
                    {selectedCount} selected
                  </div>
                ) : null}
              </div>

              <div className="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400">
                {WEEKDAYS.map((weekday) => (
                  <div key={weekday} className="py-1">{weekday}</div>
                ))}
              </div>

              <div className="mt-1 grid grid-cols-7 gap-1">
                {calendarCells.map((date, index) => {
                  if (!date) return <div key={`empty-${index}`} className="aspect-square" />;

                  const key = formatDateKey(date);
                  const selected = Boolean(selectedDates[key]);
                  const weekend = isWeekend(date);
                  const holidayName = portugalHolidays[key];
                  const disabledByWeekend = excludeWeekends && weekend;
                  const disabledByHoliday = excludePortugalHolidays && Boolean(holidayName);
                  const disabled = disabledByWeekend || disabledByHoliday;

                  let className = "relative aspect-square rounded-xl text-sm font-medium transition ";

                  if (disabledByHoliday) {
                    className += "cursor-not-allowed bg-amber-100 text-amber-800 ring-1 ring-amber-200";
                  } else if (selected) {
                    className += "bg-blue-600 text-white shadow-sm hover:bg-blue-700";
                  } else if (disabledByWeekend) {
                    className += "cursor-not-allowed bg-slate-100 text-slate-300";
                  } else if (weekend) {
                    className += "bg-slate-50 text-slate-400 hover:bg-slate-100";
                  } else if (holidayName) {
                    className += "bg-amber-50 text-amber-700 ring-1 ring-amber-100 hover:bg-amber-100";
                  } else {
                    className += "bg-white text-slate-700 ring-1 ring-slate-100 hover:bg-blue-50 hover:text-blue-700 hover:ring-blue-200";
                  }

                  return (
                    <button
                      key={key}
                      onClick={() => onDateClick(date)}
                      disabled={disabled}
                      title={
                        disabledByHoliday
                          ? `${holidayName} · Portugal national holiday excluded`
                          : holidayName
                            ? `${holidayName} · Portugal national holiday`
                            : disabledByWeekend
                              ? "Weekend excluded"
                              : selected
                                ? "Click to remove vacation"
                                : "Click to add vacation"
                      }
                      className={className}
                    >
                      {date.getDate()}
                      {holidayName ? (
                        <span className="absolute bottom-1 left-1/2 h-1 w-1 -translate-x-1/2 rounded-full bg-amber-500" />
                      ) : null}
                    </button>
                  );
                })}
              </div>
            </div>
          </Panel>
        );
      }

      function VacationCalendarPlanner() {
        const fileInputRef = useRef(null);
        const jsonTextAreaRef = useRef(null);
        const [plannerState, setPlannerState] = useState(() => readSavedPlannerState());
        const [importExportMessage, setImportExportMessage] = useState("");
        const [exportBackup, setExportBackup] = useState(null);

        const {
          year,
          excludeWeekends,
          excludePortugalHolidays,
          selectedDates,
          lastSavedAt,
        } = plannerState;

        const portugalHolidays = useMemo(() => getPortugalNationalHolidays(year), [year]);
        const currentYearSettings = getSettingsForYear(plannerState, year);
        const { baseDays, birthdayDays, bonusDays, carryOverDays } = currentYearSettings;

        useEffect(() => {
          savePlannerState(plannerState);
        }, [plannerState]);

        function updateYearSettings(fieldName, value) {
          setPlannerState((previous) => {
            const currentSettings = getSettingsForYear(previous, previous.year);
            return {
              ...previous,
              yearSettings: {
                ...previous.yearSettings,
                [previous.year]: {
                  ...currentSettings,
                  [fieldName]: value,
                },
              },
            };
          });
        }

        const totalAvailable = useMemo(() => {
          return (
            toSafeNumber(baseDays) +
            toSafeNumber(birthdayDays) +
            toSafeNumber(bonusDays) +
            toSafeNumber(carryOverDays)
          );
        }, [baseDays, birthdayDays, bonusDays, carryOverDays]);

        const selectedDateList = useMemo(() => {
          return Object.keys(selectedDates)
            .filter((dateKey) => dateKey.startsWith(`${year}-`))
            .filter((dateKey) =>
              !isBlockedDate(dateKey, {
                excludeWeekends,
                excludePortugalHolidays,
                portugalHolidays,
              })
            )
            .sort();
        }, [selectedDates, year, excludeWeekends, excludePortugalHolidays, portugalHolidays]);

        const daysUsed = selectedDateList.length;
        const remainingDays = totalAvailable - daysUsed;

        const vacationByMonth = useMemo(() => {
          return selectedDateList.reduce((acc, dateKey) => {
            const month = Number(dateKey.slice(5, 7)) - 1;
            acc[month] = (acc[month] || 0) + 1;
            return acc;
          }, {});
        }, [selectedDateList]);

        function toggleDate(date) {
          const key = formatDateKey(date);
          if (
            isBlockedDate(key, {
              excludeWeekends,
              excludePortugalHolidays,
              portugalHolidays,
            })
          ) return;

          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };
            if (nextSelectedDates[key]) delete nextSelectedDates[key];
            else nextSelectedDates[key] = { type: "Vacation" };
            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function changeYear(nextYear) {
          setPlannerState((previous) => {
            const existingSettings = previous.yearSettings?.[nextYear];
            return {
              ...previous,
              year: nextYear,
              yearSettings: {
                ...previous.yearSettings,
                [nextYear]: existingSettings || getDefaultYearSettings(),
              },
            };
          });
        }

        function toggleExcludeWeekends(checked) {
          setPlannerState((previous) => {
            const nextOptions = {
              excludeWeekends: checked,
              excludePortugalHolidays: previous.excludePortugalHolidays,
              portugalHolidays: getPortugalNationalHolidays(previous.year),
            };
            return {
              ...previous,
              excludeWeekends: checked,
              selectedDates: checked
                ? removeBlockedDatesForYear(previous.selectedDates, previous.year, nextOptions)
                : previous.selectedDates,
            };
          });
        }

        function toggleExcludePortugalHolidays(checked) {
          setPlannerState((previous) => {
            const nextOptions = {
              excludeWeekends: previous.excludeWeekends,
              excludePortugalHolidays: checked,
              portugalHolidays: getPortugalNationalHolidays(previous.year),
            };
            return {
              ...previous,
              excludePortugalHolidays: checked,
              selectedDates: checked
                ? removeBlockedDatesForYear(previous.selectedDates, previous.year, nextOptions)
                : previous.selectedDates,
            };
          });
        }

        function clearCalendarForCurrentYear() {
          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };
            Object.keys(nextSelectedDates).forEach((dateKey) => {
              if (dateKey.startsWith(`${previous.year}-`)) delete nextSelectedDates[dateKey];
            });
            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function resetCurrentYearAllowance() {
          setPlannerState((previous) => ({
            ...previous,
            yearSettings: {
              ...previous.yearSettings,
              [previous.year]: getDefaultYearSettings(),
            },
          }));
        }

        function resetEverything() {
          clearSavedPlannerState();
          setPlannerState(getDefaultPlannerState());
          setExportBackup(null);
          setImportExportMessage("Planner reset to the default setup.");
        }

        function removeSelectedDate(dateKey) {
          setPlannerState((previous) => {
            const nextSelectedDates = { ...previous.selectedDates };
            delete nextSelectedDates[dateKey];
            return { ...previous, selectedDates: nextSelectedDates };
          });
        }

        function handleNumericInput(fieldName) {
          return (event) => {
            const value = event.target.value;
            updateYearSettings(fieldName, value === "" ? 0 : Number(value));
          };
        }

        function exportPlannerJson() {
          const payload = createExportPayload(plannerState);
          const filename = `${BACKUP_FILE_PREFIX}-backup.json`;
          const preparedExport = createJsonExport(filename, payload);
          setExportBackup(preparedExport);
          setImportExportMessage(
            `Full backup prepared: ${filename}. This includes selected dates and allowance settings for all saved years. If downloads are blocked, select the JSON text and copy it manually.`
          );
        }

        function selectExportJsonText() {
          if (!jsonTextAreaRef.current) return;
          jsonTextAreaRef.current.focus();
          jsonTextAreaRef.current.select();
          setImportExportMessage("JSON text selected. Press Ctrl+C to copy it manually if the download link is blocked.");
        }

        function openImportDialog() {
          if (fileInputRef.current) {
            fileInputRef.current.value = "";
            fileInputRef.current.click();
          }
        }

        function importPlannerJson(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsedJson = JSON.parse(String(reader.result));
              const importedState = getImportablePlannerState(parsedJson);
              setPlannerState(importedState);
              setExportBackup(null);
              setImportExportMessage(`Imported ${file.name}. The planner was updated and saved in this browser.`);
            } catch (error) {
              console.error("Could not import JSON file:", error);
              setImportExportMessage("Import failed. Please select a valid vacation planner JSON file.");
            }
          };
          reader.onerror = () => setImportExportMessage("Import failed. The file could not be read.");
          reader.readAsText(file);
        }

        const balanceTone = remainingDays < 0 ? "red" : "green";
        const readableLastSavedAt = lastSavedAt
          ? new Date(lastSavedAt).toLocaleString()
          : "Automatically saved in this browser";
        const portugalHolidayCount = Object.keys(portugalHolidays).length;

        return (
          <div className="min-h-screen bg-slate-50 p-4 text-slate-900 md:p-8">
            <div className="mx-auto max-w-7xl space-y-6">
              <header className="overflow-hidden rounded-3xl bg-gradient-to-r from-slate-950 via-slate-900 to-slate-800 p-6 text-white shadow-xl md:p-8">
                <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                  <div>
                    <div className="mb-3 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-sm text-slate-200 ring-1 ring-white/15">
                      <span role="img" aria-label="calendar">📅</span>
                      Interactive annual planner
                    </div>
                    <h1 className="text-3xl font-semibold tracking-tight md:text-5xl">
                      Vacation Control Calendar
                    </h1>
                    <p className="mt-3 max-w-2xl text-sm leading-6 text-slate-300 md:text-base">
                      Select planned vacation days directly on the calendar and instantly see how many days are used and how many remain from your yearly allowance.
                    </p>
                    <div className="mt-3 flex flex-wrap gap-2">
                      <p className="inline-flex rounded-full bg-emerald-400/10 px-3 py-1 text-xs font-medium text-emerald-200 ring-1 ring-emerald-300/20">
                        Auto-save enabled · stored locally in this browser
                      </p>
                      <p className="inline-flex rounded-full bg-blue-400/10 px-3 py-1 text-xs font-medium text-blue-200 ring-1 ring-blue-300/20">
                        Full JSON backup · all years included
                      </p>
                      <p className="inline-flex rounded-full bg-amber-400/10 px-3 py-1 text-xs font-medium text-amber-200 ring-1 ring-amber-300/20">
                        Portugal national holidays available
                      </p>
                    </div>
                  </div>

                  <div className="rounded-2xl bg-white/10 p-4 ring-1 ring-white/15 backdrop-blur">
                    <label className="mb-2 block text-xs font-medium uppercase tracking-wide text-slate-300">
                      Planning year
                    </label>
                    <input
                      type="number"
                      value={year}
                      onChange={(event) => changeYear(Number(event.target.value))}
                      className="w-32 rounded-xl border border-white/20 bg-white px-3 py-2 text-lg font-semibold text-slate-950 outline-none focus:ring-2 focus:ring-white/40"
                    />
                  </div>
                </div>
              </header>

              <section className="grid gap-4 md:grid-cols-4">
                <StatCard label="Total available" value={totalAvailable} icon="➕" tone="default" subtext={`Allowance for ${year}`} />
                <StatCard label="Scheduled vacation" value={daysUsed} icon="✈️" tone="blue" subtext={`Counted days in ${year}`} />
                <StatCard label="Remaining" value={remainingDays} icon="🎁" tone={balanceTone} subtext={`Balance for ${year}`} />
                <StatCard
                  label="Balance status"
                  value={remainingDays < 0 ? "Over planned" : "Within allowance"}
                  subtext={remainingDays < 0 ? `${Math.abs(remainingDays)} day(s) above your allowance.` : `${remainingDays} day(s) still available.`}
                  icon={remainingDays < 0 ? "⚠️" : "✅"}
                  tone={remainingDays < 0 ? "red" : "green"}
                />
              </section>

              <section className="grid gap-6 lg:grid-cols-[340px_1fr]">
                <aside className="space-y-6">
                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Allowance input for {year}</h2>
                        <p className="mt-1 text-sm text-slate-500">These values are saved separately for each selected year.</p>
                      </div>
                      <div className="space-y-3">
                        <AllowanceInput label="Base vacation days" value={baseDays} onChange={handleNumericInput("baseDays")} />
                        <AllowanceInput label="Birthday day" value={birthdayDays} onChange={handleNumericInput("birthdayDays")} />
                        <AllowanceInput label="Bonus days" value={bonusDays} onChange={handleNumericInput("bonusDays")} />
                        <AllowanceInput label="Carry-over from last year" value={carryOverDays} onChange={handleNumericInput("carryOverDays")} />
                      </div>
                      <div className="rounded-2xl bg-slate-100 p-4">
                        <div className="flex items-start gap-3">
                          <span className="mt-0.5 text-lg">ℹ️</span>
                          <div>
                            <p className="text-sm font-medium">Current setup for {year}</p>
                            <p className="mt-1 text-sm text-slate-600">
                              {baseDays} base + {birthdayDays} birthday + {bonusDays} bonus + {carryOverDays} carry-over = {totalAvailable} total days.
                            </p>
                          </div>
                        </div>
                      </div>
                      <button onClick={resetCurrentYearAllowance} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        Reset allowance for {year}
                      </button>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Calendar rules</h2>
                        <p className="mt-1 text-sm text-slate-500">Control how clicked days are counted.</p>
                      </div>
                      <label className="flex cursor-pointer items-center justify-between rounded-2xl bg-slate-100 p-4">
                        <span>
                          <span className="block text-sm font-medium">Exclude weekends</span>
                          <span className="block text-xs text-slate-500">Saturday and Sunday cannot be selected.</span>
                        </span>
                        <input type="checkbox" checked={excludeWeekends} onChange={(event) => toggleExcludeWeekends(event.target.checked)} className="h-5 w-5 accent-slate-900" />
                      </label>
                      <label className="flex cursor-pointer items-center justify-between rounded-2xl bg-amber-50 p-4 ring-1 ring-amber-100">
                        <span>
                          <span className="block text-sm font-medium text-amber-950">Exclude Portugal national holidays</span>
                          <span className="block text-xs text-amber-800">Highlights and blocks {portugalHolidayCount} national holidays for {year}.</span>
                        </span>
                        <input type="checkbox" checked={excludePortugalHolidays} onChange={(event) => toggleExcludePortugalHolidays(event.target.checked)} className="h-5 w-5 accent-amber-600" />
                      </label>
                      <p className="rounded-2xl bg-slate-100 p-4 text-xs text-slate-600">
                        Portugal mode includes national holidays such as Good Friday, Easter Sunday and Corpus Christi. It does not include municipal, regional or optional holidays such as Carnival.
                      </p>
                      <button onClick={clearCalendarForCurrentYear} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        ↺ Clear selected days for {year}
                      </button>
                      <button onClick={resetEverything} className="w-full rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700 transition hover:bg-red-100">
                        Reset everything
                      </button>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-4 p-5">
                      <div>
                        <h2 className="text-lg font-semibold">Backup and transfer</h2>
                        <p className="mt-1 text-sm text-slate-500">Export your full planner to a JSON file, including all saved years, move it to another device, and import it there.</p>
                      </div>
                      <button onClick={exportPlannerJson} className="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-slate-800">
                        ⬇ Export full JSON backup
                      </button>
                      <button onClick={openImportDialog} className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        ⬆ Import JSON backup
                      </button>
                      {exportBackup ? (
                        <div className="space-y-3 rounded-2xl bg-slate-100 p-4">
                          <a href={exportBackup.dataUrl} download={exportBackup.filename} className="block rounded-xl bg-blue-600 px-4 py-3 text-center text-sm font-medium text-white transition hover:bg-blue-700">
                            Download {exportBackup.filename}
                          </a>
                          <button onClick={selectExportJsonText} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                            Select JSON text
                          </button>
                          <textarea ref={jsonTextAreaRef} readOnly value={exportBackup.json} className="h-36 w-full rounded-xl border border-slate-200 bg-white p-3 font-mono text-xs text-slate-700 outline-none" />
                        </div>
                      ) : null}
                      <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={importPlannerJson} className="hidden" />
                      {importExportMessage ? (
                        <p className="rounded-2xl bg-blue-50 p-4 text-sm text-blue-800">{importExportMessage}</p>
                      ) : (
                        <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-600">Tip: after making changes in any year, export a new JSON file so your backup contains the full latest plan.</p>
                      )}
                    </div>
                  </Panel>

                  <Panel>
                    <div className="space-y-3 p-5">
                      <h2 className="text-lg font-semibold">Save status</h2>
                      <p className="rounded-2xl bg-emerald-50 p-4 text-sm text-emerald-800">Your planner is saved automatically in this browser. Use JSON export/import to move the same full plan between devices or browsers.</p>
                      <p className="text-xs text-slate-500">Last loaded/saved: {readableLastSavedAt}</p>
                    </div>
                  </Panel>

                  <Panel>
                    <div className="p-5">
                      <h2 className="text-lg font-semibold">Selected days in {year}</h2>
                      <div className="mt-4 max-h-80 space-y-2 overflow-auto pr-1">
                        {selectedDateList.length === 0 ? (
                          <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-500">No counted vacation days selected for {year} yet. Click working days in the calendar to add them.</p>
                        ) : (
                          selectedDateList.map((dateKey) => (
                            <div key={dateKey} className="flex items-center justify-between rounded-2xl bg-blue-50 px-4 py-3 text-sm">
                              <span className="font-medium text-blue-950">{dateKey}</span>
                              <button onClick={() => removeSelectedDate(dateKey)} className="rounded-full px-2 py-1 text-xs font-medium text-blue-700 hover:bg-blue-100">Remove</button>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </Panel>
                </aside>

                <main className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  {MONTH_NAMES.map((monthName, monthIndex) => (
                    <MonthCalendar
                      key={`${year}-${monthIndex}`}
                      year={year}
                      monthIndex={monthIndex}
                      monthName={monthName}
                      selectedDates={selectedDates}
                      onDateClick={toggleDate}
                      excludeWeekends={excludeWeekends}
                      excludePortugalHolidays={excludePortugalHolidays}
                      portugalHolidays={portugalHolidays}
                      selectedCount={vacationByMonth[monthIndex] || 0}
                    />
                  ))}
                </main>
              </section>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<VacationCalendarPlanner />);
    </script>
  </body>
</html>
